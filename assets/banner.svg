<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="55%" stop-color="#151a24"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#7c4fff"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- subtle grid dots -->
  <g fill="#2a3142" opacity="0.5">
    <circle cx="60" cy="40" r="2"/>
    <circle cx="120" cy="40" r="2"/>
    <circle cx="180" cy="40" r="2"/>
    <circle cx="60" cy="240" r="2"/>
    <circle cx="120" cy="240" r="2"/>
    <circle cx="180" cy="240" r="2"/>
    <circle cx="1140" cy="40" r="2"/>
    <circle cx="1080" cy="40" r="2"/>
    <circle cx="1140" cy="240" r="2"/>
    <circle cx="1080" cy="240" r="2"/>
  </g>

  <!-- shield icon -->
  <g transform="translate(70, 90)">
    <path d="M50 0 L95 18 V55 C95 85 75 105 50 115 C25 105 5 85 5 55 V18 Z"
          fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M32 58 L45 71 L70 42" fill="none" stroke="#4f7cff" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="220" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff">FortifyWebX Scanner</text>

  <!-- Subtitle -->
  <text x="222" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" fill="#9aa3b5">Non-Intrusive Web Application Vulnerability Scanner</text>

  <!-- workflow arrows -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <text x="222" y="205" fill="#4dd0ff">Target</text>
    <text x="298" y="205" fill="#5a6478">&#8594;</text>
    <text x="325" y="205" fill="#7c4fff">Crawl</text>
    <text x="400" y="205" fill="#5a6478">&#8594;</text>
    <text x="428" y="205" fill="#ffbb4d">Scan</text>
    <text x="495" y="205" fill="#5a6478">&#8594;</text>
    <text x="523" y="205" fill="#ff5f5f">Detect</text>
    <text x="605" y="205" fill="#5a6478">&#8594;</text>
    <text x="633" y="205" fill="#4dff88">Report</text>
  </g>

  <!-- bottom divider line -->
  <rect x="0" y="270" width="1200" height="2" fill="url(#accent)" opacity="0.6"/>
</svg>
